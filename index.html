<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UBOSS AI AMS — Enterprise Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#102A43; --navy-700:#1C4A73; --navy-900:#0A1E33;
  --blue:#2563EB; --blue-600:#1D4FD8; --blue-050:#EEF3FF; --blue-100:#DBE7FF;
  --cyan:#0BA6E4; --cyan-050:#E6F6FD;
  --success:#15803D; --success-050:#E7F6EC;
  --warning:#B4610A; --warning-050:#FBF1E3;
  --danger:#BE1B1B; --danger-050:#FCEBEB;
  --purple:#6D28D9; --purple-050:#F1EBFC;
  --surface:#FFFFFF; --bg:#F5F8FC; --bg-2:#EDF2F8;
  --border:#E4EAF2; --border-2:#EEF2F8;
  --text:#0F1D2E; --text-2:#54637A; --text-3:#8994A6;
  --r-in:8px; --r-card:12px; --r-panel:16px;
  --sp:8px;
  --sh-1:0 1px 2px rgba(15,29,46,.05),0 1px 2px rgba(15,29,46,.04);
  --sh-2:0 6px 18px rgba(15,29,46,.07);
  --sh-3:0 18px 44px rgba(15,29,46,.16);
  --side-w:248px; --top-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--blue-100)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
#root{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#DCE6F2;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.side-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.side-brand b{color:#fff;font-size:15px;letter-spacing:.2px}
.side-brand span{display:block;font-size:11px;color:#8FA6C0}
.side-scroll{overflow-y:auto;flex:1;padding:6px 10px 16px}
.side-scroll::-webkit-scrollbar{width:8px}.side-scroll::-webkit-scrollbar-thumb{background:#26496b;border-radius:8px}
.nav-group{margin:12px 8px 4px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#6E88A6;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#C4D4E6;font-weight:500;cursor:pointer;margin:1px 0}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:var(--sh-1)}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:600}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25)}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#2C4E70;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
.ws-mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--navy)}
.ws-mark .pipe{color:var(--border);font-weight:400}
.ws-mark .ws-name{color:var(--text)}
.ws-switch{margin-left:2px;color:var(--text-3);cursor:pointer}
.top-search{margin-left:14px;flex:1;max-width:420px;position:relative}
.top-search input{width:100%;height:38px;border:1px solid var(--border);border-radius:9px;padding:0 12px 0 34px;background:var(--bg);font-size:13px}
.top-search svg{position:absolute;left:10px;top:10px;color:var(--text-3)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--bg)}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}

.content{padding:22px 24px 60px;max-width:1440px;width:100%;margin:0 auto}
.crumb{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12.5px;margin-bottom:8px}
.crumb b{color:var(--text-2);font-weight:500}
.crumb .sep{opacity:.6}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.page-head p{color:var(--text-2);font-size:13px;margin-top:3px}
.page-actions{margin-left:auto;display:flex;gap:8px}

/* ---------- Buttons ---------- */
.btn{height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--bg)}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#1D4FD8}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-700)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn-danger:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}.btn-ghost:hover{background:var(--bg)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;justify-content:center;height:44px;font-size:14px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1)}
.card-p{padding:18px}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:10px}
.card-hd h3{font-size:14.5px;font-weight:700}
.card-hd .sub{color:var(--text-3);font-size:12px}
.grid{display:grid;gap:16px}
.muted{color:var(--text-2)}.muted-3{color:var(--text-3)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border-2);font-size:13px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--text-3)}.kv .v{font-weight:600;text-align:right}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-success{background:var(--success-050);color:var(--success)}
.b-blue{background:var(--blue-050);color:var(--blue)}
.b-cyan{background:var(--cyan-050);color:#0876a8}
.b-warn{background:var(--warning-050);color:var(--warning)}
.b-danger{background:var(--danger-050);color:var(--danger)}
.b-purple{background:var(--purple-050);color:var(--purple)}
.b-grey{background:var(--bg-2);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--text-2)}

/* medal badges */
.medal{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:700}
.m-bronze{background:#F6ECE2;color:#8A5A2B}.m-silver{background:#ECEFF3;color:#5B6672}
.m-gold{background:#FBF1D6;color:#96751B}.m-platinum{background:#E6F0F1;color:#2C6E72}
.m-diamond{background:#E8EEFF;color:#3552C7}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--text-3);font-size:11.5px;letter-spacing:.3px;
  padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--blue-050)}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who .avatar{width:28px;height:28px;font-size:11px}
.tbl .who b{font-weight:600}.tbl .who small{color:var(--text-3);display:block;font-size:11.5px}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-2);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:var(--sh-1)}
.search-mini{position:relative}
.search-mini input{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px 0 30px;background:var(--surface);width:220px;font-size:13px}
.search-mini svg{position:absolute;left:9px;top:8px;color:var(--text-3)}
.filter{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--surface);font-size:13px;color:var(--text-2)}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field label .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r-in);
  padding:0 12px;font-size:13.5px;background:var(--surface);color:var(--text);transition:.12s}
.field textarea{height:auto;padding:10px 12px;min-height:80px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:5px}
.field.err input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-050)}
.field .err-msg{color:var(--danger);font-size:11.5px;margin-top:5px;font-weight:500}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.section-label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);font-weight:700;
  margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border-2)}

/* ---------- Donut ---------- */
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 32px}
.donut-legend{display:flex;gap:30px;margin-top:26px}
.leg{display:flex;align-items:center;gap:9px}
.leg .sw{width:12px;height:12px;border-radius:4px}
.leg b{font-size:15px}.leg span{color:var(--text-3);font-size:12.5px;display:block}

/* ---------- Stepper ---------- */
.stepper{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:13px;padding:4px 0}
.step .mk{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;
  border:2px solid var(--border);color:var(--text-3);background:#fff;position:relative;z-index:1}
.step .line{position:absolute;left:12px;top:26px;bottom:-6px;width:2px;background:var(--border-2)}
.step.done .mk{background:var(--success);border-color:var(--success);color:#fff}
.step.run .mk{border-color:var(--blue);color:var(--blue)}
.step.run .mk .pulse{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--blue);opacity:.4;animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.step .lbl{font-weight:600;font-size:13px;padding-top:3px}
.step.todo .lbl{color:var(--text-3)}
.step .sub{font-size:11.5px;color:var(--text-3);font-weight:400}
.hstep{display:flex;align-items:center;gap:0}
.hstep .s{display:flex;align-items:center;gap:9px;color:var(--text-3);font-weight:600;font-size:13px}
.hstep .s .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:12px}
.hstep .s.on{color:var(--blue)}.hstep .s.on .n{border-color:var(--blue);background:var(--blue);color:#fff}
.hstep .s.done{color:var(--success)}.hstep .s.done .n{border-color:var(--success);background:var(--success);color:#fff}
.hstep .bar{flex:1;height:2px;background:var(--border);margin:0 12px;min-width:24px}
.hstep .bar.done{background:var(--success)}

/* ---------- Workflow ---------- */
.canvas{position:relative;background:
  radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0);background-size:22px 22px;
  border:1px solid var(--border);border-radius:var(--r-card);min-height:520px;overflow:auto;padding:8px}
.wf-goal{background:linear-gradient(135deg,var(--navy),var(--navy-700));color:#fff;border-radius:30px;padding:12px 22px;
  font-weight:700;box-shadow:var(--sh-2);text-align:center}
.wf-node{background:#fff;border:1.5px solid var(--border);border-radius:10px;box-shadow:var(--sh-1);width:186px}
.wf-node .h{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--border-2);font-weight:700;font-size:12.5px}
.wf-node .b{padding:9px 11px;font-size:11.5px;color:var(--text-2)}
.wf-node.human{border-color:#C9D6E5}
.wf-node.human .h{color:var(--navy)}
.wf-node.human .tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.wf-ai{position:relative;width:150px;height:150px}
.wf-ai .diamond{position:absolute;inset:14px;background:var(--cyan-050);border:1.5px solid var(--cyan);transform:rotate(45deg);border-radius:14px}
.wf-ai .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px}
.wf-ai .lbl b{font-size:12.5px;color:#0876a8}.wf-ai .lbl small{font-size:10.5px;color:var(--text-3);margin-top:3px}
.wf-approve{background:var(--warning-050);border:1.5px solid #E4B063;border-radius:10px;padding:10px 14px;width:170px;text-align:center;font-weight:700;color:var(--warning);font-size:12.5px}
.wf-cond{width:120px;height:120px;position:relative}
.wf-cond .d{position:absolute;inset:10px;background:var(--purple-050);border:1.5px dashed var(--purple);transform:rotate(45deg);border-radius:12px}
.wf-cond .l{position:absolute;inset:0;display:grid;place-items:center;color:var(--purple);font-weight:700;font-size:11.5px}
.legend-nodes{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend-nodes .li{display:flex;align-items:center;gap:7px}
.sw-rect{width:16px;height:12px;border:1.5px solid #C9D6E5;background:#fff;border-radius:3px}
.sw-diamond{width:14px;height:14px;background:var(--cyan-050);border:1.5px solid var(--cyan);transform:rotate(45deg);border-radius:3px}
.sw-goal{width:16px;height:12px;background:var(--navy);border-radius:8px}
.sw-appr{width:14px;height:14px;background:var(--warning-050);border:1.5px solid #E4B063;border-radius:3px}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(12,35,55,.46);backdrop-filter:blur(2px);
  display:flex;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{margin:auto;background:#fff;border-radius:16px;box-shadow:var(--sh-3);width:min(560px,92vw);max-height:88vh;overflow:auto;animation:pop .16s}
.modal.wide{width:min(720px,94vw)}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}}
.drawer{margin-left:auto;background:#fff;height:100vh;width:min(680px,94vw);box-shadow:var(--sh-3);overflow:auto;animation:slide .2s}
@keyframes slide{from{transform:translateX(24px);opacity:.7}}
.ov-hd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border-2);position:sticky;top:0;background:#fff;z-index:2}
.ov-hd h3{font-size:16px;font-weight:700}
.ov-hd .x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.ov-bd{padding:22px}
.ov-ft{padding:16px 22px;border-top:1px solid var(--border-2);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ---------- States ---------- */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;gap:8px}
.state .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.state h3{font-size:16px;font-weight:700}.state p{color:var(--text-2);max-width:420px}
.skel{background:linear-gradient(90deg,var(--bg-2) 25%,#e9eef4 37%,var(--bg-2) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:7px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:11px;font-size:13px;font-weight:500}
.banner.warn{background:var(--warning-050);color:#7a3d08;border:1px solid #EAD3AE}
.banner.danger{background:var(--danger-050);color:#7f1616;border:1px solid #EBC3C3}
.banner.info{background:var(--blue-050);color:#1b3e8f;border:1px solid #C6D8FA}
.banner.ok{background:var(--success-050);color:#155e2e;border:1px solid #BFE3CB}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;
  padding:12px 18px;border-radius:11px;box-shadow:var(--sh-3);display:flex;align-items:center;gap:10px;z-index:80;font-weight:500;animation:up .2s}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}}

/* vision strip */
.vm-strip{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.vm{background:linear-gradient(120deg,var(--navy),#14446b);color:#fff;border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.vm.mission{background:linear-gradient(120deg,#0e3550,#0a2a41)}
.vm .lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#93B0CC;font-weight:700;margin-bottom:6px}
.vm p{font-size:14px;line-height:1.5;font-weight:500}
.vm .glow{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.4),transparent 70%)}

/* tree */
.tree{padding:8px}
.tnode{margin:4px 0}
.tcard{display:inline-flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 13px;box-shadow:var(--sh-1);cursor:pointer}
.tcard:hover{border-color:var(--blue);box-shadow:var(--sh-2)}
.tcard b{font-weight:600;font-size:13.5px}.tcard small{color:var(--text-3);display:block;font-size:11.5px}
.tchild{margin-left:34px;padding-left:22px;border-left:2px solid var(--border-2)}

/* login */
.login{display:grid;grid-template-columns:45% 55%;min-height:100vh}
.login-left{background:linear-gradient(160deg,var(--navy-900),var(--navy) 55%,#14446b);color:#fff;padding:46px 52px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-left .glow1{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.28),transparent 68%);top:-60px;right:-80px}
.login-left .glow2{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.25),transparent 68%);bottom:-70px;left:-60px}
.login-brand{display:flex;align-items:center;gap:12px;z-index:1}
.login-brand .side-logo{width:38px;height:38px;font-size:18px}
.login-brand b{font-size:19px}.login-brand span{font-size:12px;color:#9DB6D0}
.login-caps{margin-top:auto;margin-bottom:auto;z-index:1}
.login-caps h2{font-size:15px;color:#A9C1DA;font-weight:600;margin-bottom:20px;letter-spacing:.3px}
.cap{display:flex;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.cap .n{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.cap b{font-size:16px;font-weight:700;display:block}
.cap small{color:#9DB6D0;font-size:12px}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:min(380px,100%)}
.login-card h1{font-size:24px;font-weight:700;margin-bottom:4px}
.login-card .sub{color:var(--text-2);margin-bottom:26px}
.or{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.auth-note{margin-top:22px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text-3);display:flex;gap:9px}

/* master console dark */
.shell.master .sidebar{background:var(--navy-900)}
.shell.master .topbar{background:var(--navy-900);border-bottom-color:#20374d}
.shell.master .ws-mark,.shell.master .top-search svg{color:#fff}
.shell.master .ws-mark .ws-name{color:#8FB4D8}
.shell.master .top-search input{background:#12263a;border-color:#20374d;color:#fff}
.shell.master .icon-btn{background:#12263a;border-color:#20374d;color:#B8CBDF}
.shell.master .main{background:#0a1b2b}
.shell.master .content .card,.shell.master .content .tbl-wrap{background:#10233a;border-color:#20374d}
.shell.master .content{color:#DCE7F2}
.shell.master .kpi{background:#10233a;border:1px solid #20374d}
.shell.master .page-head h1{color:#fff}.shell.master .page-head p{color:#8FB4D8}
.shell.master .crumb b,.shell.master .crumb{color:#7E9CBC}
.shell.master .tbl th{background:#0d1f33;color:#7E9CBC;border-color:#20374d}
.shell.master .tbl td{border-color:#1a3049;color:#CBD9E8}
.shell.master .tbl tbody tr:hover{background:#15304b}
.shell.master .kv{border-color:#1a3049}.shell.master .kv .k{color:#7E9CBC}
.shell.master .card-hd{border-color:#20374d}
.kpi{border-radius:12px;padding:16px 18px}
.kpi .lab{font-size:12px;color:var(--text-3)}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .delta{font-size:12px;font-weight:600}
.shell.master .kpi .lab{color:#7E9CBC}.shell.master .kpi .val{color:#fff}

.spread{display:flex;align-items:center;gap:10px}
.right{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:2px}
hr.sep{border:0;border-top:1px solid var(--border-2);margin:16px 0}
.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.pill-tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.pill-tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.notice-min{font-size:11.5px;color:var(--text-3);display:flex;gap:6px;align-items:flex-start;margin-top:6px}

@media(max-width:1080px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:var(--sh-3)}

  .row-2,.vm-strip,.login{grid-template-columns:1fr}

}

  return '<svg width="240" height="240" viewBox="0 0 220 220" style="transform:rotate(-90deg)">'+
    '<defs>'+
      '<linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FD0F5"/><stop offset="1" stop-color="#0BA6E4"/></linearGradient>'+

    '</defs>'+

    '<circle class="slice slice-anim" data-nav="app/agents" cx="110" cy="110" r="80" fill="none" stroke="url(#gCyan)" stroke-width="34" stroke-linecap="round" '+
      'stroke-dasharray="'+la+' '+(C-la)+'" stroke-dashoffset="'+oa+'" style="--o:'+oa+';--l:'+la+';cursor:pointer"/>'+
    '<circle class="slice slice-anim" data-nav="app/todo" cx="110" cy="110" r="80" fill="none" stroke="url(#gBlue)" stroke-width="34" stroke-linecap="round" '+
      'stroke-dasharray="'+lp+' '+(C-lp)+'" stroke-dashoffset="'+op+'" style="--o:'+op+';--l:'+lp+';animation-delay:.12s;cursor:pointer"/>'+

function orgSVG(forExport){
  const root=orgData();const bw=214,bh=64,hg=22,vg=50,px=28,py=22;let leaf=0,maxD=0;
  (function lay(n,d){n.d=d;maxD=Math.max(maxD,d);n.y=py+d*(bh+vg)+bh/2;
    if(n.children&&n.children.length){n.children.forEach(c=>lay(c,d+1));n.x=(n.children[0].x+n.children[n.children.length-1].x)/2;}
    else{n.x=px+leaf*(bw+hg)+bw/2;leaf++;}})(root,0);
  const W=Math.round(px*2+Math.max(leaf,1)*(bw+hg)-hg), H=Math.round(py*2+(maxD+1)*(bh+vg)-vg);
  let links='',nodes='';
  (function draw(n){(n.children||[]).forEach(c=>{const y1=n.y+bh/2,y2=c.y-bh/2,my=(y1+y2)/2;
    links+='<path d="M'+n.x+' '+y1+' V'+my+' H'+c.x+' V'+y2+'" fill="none" stroke="#CDDAEA" stroke-width="1.6"/>';draw(c);});
    nodes+=nodeSVG(n,bw,bh);})(root);
  return '<svg id="orgSvg"'+(forExport?' xmlns="http://www.w3.org/2000/svg"':'')+' width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Inter, system-ui, sans-serif">'+

    '<rect width="'+W+'" height="'+H+'" fill="#ffffff"/>'+links+nodes+'</svg>';
}

function navCount(key){const L=role().label;
  const P=(typeof PENDING!=='undefined')?PENDING.length:12,A=(typeof AGENTS!=='undefined')?AGENTS.length:8,E=(typeof EXCEPTIONS!=='undefined')?EXCEPTIONS.length:5;
  const todo={Employee:4,Manager:9,'Head — Regulatory':9,'Company Admin':P,Approver:0,Guest:1};
  const appr={Employee:1,Manager:3,'Head — Regulatory':4,'Company Admin':5,Approver:5};
  const exec={Manager:E,'Head — Regulatory':E,'Company Admin':E};
  const eng={Employee:3,Manager:A,'Head — Regulatory':A,'Company Admin':A};
  if(key==='todo')return todo[L]!=null?todo[L]:P;
  if(key==='approvals')return appr[L]!=null?appr[L]:null;
  if(key==='executor')return exec[L]!=null?exec[L]:null;

function sidebar(nav,active,master){
  const r=role();const allow=r.nav;
  let html='<aside class="sidebar"><div class="side-brand"><div class="side-logo">U</div>'+
    '<div class="brandtext"><b>'+(master?'UBoss':'UBOSS AI AMS')+'</b><span>'+(master?'Master Console':WS.name)+'</span></div>'+
    '<button class="sidebar-toggle" data-action="side-collapse" title="Collapse / expand sidebar">'+PANEL_SVG+'</button>'+
    '</div><div class="side-scroll">';
  nav.forEach(g=>{
    const items=g.items.filter(it=>allow==='*'||allow.includes(it.key));
    if(!items.length)return;
    html+='<div class="nav-group">'+g.group+'</div>';
    items.forEach(it=>{const on=it.key===active;const cnt=master?null:navCount(it.key);
      html+='<div class="nav-item'+(on?' active':'')+'" title="'+it.label+'" data-nav="'+(master?'master/':'app/')+it.key+'"><span class="ico">'+ic(it.icon,18)+'</span><span class="nav-lbl">'+it.label+'</span>'+
        (cnt&&cnt>0?'<span class="nav-badge">'+cnt+'</span>':'')+'</div>';});
  });
  html+='</div><div class="side-foot">'+av(r.label)+'<div class="stack"><b style="color:#fff;font-size:12.5px">'+r.label+'</b>'+
    '<span style="font-size:11px;color:#8FA6C0" data-action="logout" style="cursor:pointer">Sign out</span></div></div></aside>';
  return html;
}

function ROUTE_GUARD(h){

function harvestF3(){document.querySelectorAll('#f3-body tr[data-row]').forEach((tr,i)=>{if(!F3_ROWS[i])return;F3_COLS.forEach(c=>{if(c.type==='step')return;const el=tr.querySelector('[data-f="'+c.f+'"]');if(el)F3_ROWS[i][c.f]=(el.tagName==='SELECT')?el.value:el.textContent.trim();});});}
function f3Cell(row,c,i){
  if(c.type==='step')return '<td class="stepn stick">'+(i+1)+'</td>';
  if(c.type==='engine'){const o=['Human','Engine','Sub-Engine','Executor'];return '<td><select class="ce" data-f="engine">'+o.map(x=>'<option'+(row.engine===x?' selected':'')+'>'+x+'</option>').join('')+'</select></td>';}
  if(c.type==='approval'){const o=['Not required','Manager','Head','Four-eyes'];return '<td><select class="ce" data-f="approval">'+o.map(x=>'<option'+(row.approval===x?' selected':'')+'>'+x+'</option>').join('')+'</select></td>';}
  if(c.type==='ifwrong'){const o=['Stop','Skip','Ask Human','Retry','Alert','Route for Approval'];return '<td><select class="ce" data-f="ifwrong">'+o.map(x=>'<option'+(row.ifwrong===x?' selected':'')+'>'+x+'</option>').join('')+'</select></td>';}
  return '<td><div class="ce cell'+(c.w>160?' w':'')+'" contenteditable="true" data-f="'+c.f+'">'+(row[c.f]||'')+'</div></td>';
}
function renderF3Grid(){
  let grp='<tr class="grp"><th class="stick"></th>';let i=0;
  while(i<F3_COLS.length){if(i===0){i++;continue;}const g=F3_COLS[i].g;let span=0;while(i+span<F3_COLS.length&&F3_COLS[i+span].g===g&&g!=='')span++;
    if(g===''){grp+='<th>'+F3_COLS[i].t+'</th>';i++;}else{grp+='<th colspan="'+span+'">'+g+'</th>';i+=span;}}
  grp+='<th></th></tr>';
  let sub='<tr class="sub"><th class="stick">Step</th>';F3_COLS.forEach((c,idx)=>{if(idx===0)return;sub+='<th style="min-width:'+c.w+'px">'+c.t+'</th>';});sub+='<th>Row</th></tr>';
  const body=F3_ROWS.map((row,i)=>'<tr data-row="'+i+'">'+F3_COLS.map(c=>f3Cell(row,c,i)).join('')+
    '<td><div class="rowops"><button data-action="f3" data-op="up" data-i="'+i+'" title="Move up">↑</button>'+
    '<button data-action="f3" data-op="down" data-i="'+i+'" title="Move down">↓</button>'+
    '<button data-action="f3" data-op="ins" data-i="'+i+'" title="Insert below">+</button>'+
    '<button data-action="f3" data-op="dup" data-i="'+i+'" title="Duplicate">⧉</button>'+
    '<button data-action="f3" data-op="del" data-i="'+i+'" title="Delete">✕</button></div></td></tr>').join('');
  return '<table class="wfg"><thead>'+grp+sub+'</thead><tbody id="f3-body">'+body+'</tbody></table>';
}
const F3_BLANK={person:'',role:'',engine:'Human',trigger:'',freq:'',work:'',input:'',inwhere:'',method:'',perf:'',rule:'',output:'',dest:'',approval:'Not required',ifwrong:'Ask Human',time:''};
EXTRA_ACTIONS['f3']=(el)=>{harvestF3();const op=el.dataset.op,i=+el.dataset.i;
  if(op==='up'&&i>0){[F3_ROWS[i-1],F3_ROWS[i]]=[F3_ROWS[i],F3_ROWS[i-1]];}
  if(op==='down'&&i<F3_ROWS.length-1){[F3_ROWS[i+1],F3_ROWS[i]]=[F3_ROWS[i],F3_ROWS[i+1]];}
  if(op==='ins')F3_ROWS.splice(i+1,0,Object.assign({},F3_BLANK));
  if(op==='dup')F3_ROWS.splice(i+1,0,Object.assign({},F3_ROWS[i]));
  if(op==='del'&&F3_ROWS.length>1)F3_ROWS.splice(i,1);
  const w=document.querySelector('.f3grid-wrap');if(w){w.innerHTML=renderF3Grid();bindActions(w);}};

function hasCap(key,email){const r=ROLES[email||SESSION.email];if(r&&r.kind==='platform')return false;return capsOf(email).indexOf(key)>-1;}
function navFromCaps(email){
 const base=ROLES[email]||ROLES['admin@spm.demo'];
 const out=FREE_NAV.slice();
 capsOf(email).forEach(k=>{const c=CAP_BY_KEY[k];if(c)c.nav.forEach(n=>{if(out.indexOf(n)<0)out.push(n);});});
 /* keep any module the base role could already reach that no capability governs */
 (base.nav==='*'?allNavKeys():base.nav).forEach(n=>{if(CAP_NAV_KEYS.indexOf(n)<0&&out.indexOf(n)<0)out.push(n);});
 return out;
}
/* role() now resolves navigation from capabilities for company users.
   Platform (Master Console) roles are untouched. */
function role(){
 const base=ROLES[SESSION.email]||ROLES['admin@spm.demo'];
 if(base.kind!=='company')return base;
 const r=Object.assign({},base);
 const a=ACCESS[SESSION.email];
 r.caps=capsOf(SESSION.email);
 r.nav=navFromCaps(SESSION.email);
 r.tenant=a?a.tenant:TENANT;
 r.userType=a?a.userType:'Internal employee';
 return r;
}
/* An admin can never delegate a capability they do not hold themselves. */
function canDelegate(capKey,email){
 const r=ROLES[email||SESSION.email];
 if(!r||r.kind!=='company')return false;
 if(!hasCap('users.manage',email))return false;
 return hasCap(capKey,email);
}

/* ============================================================
   3. BACKEND-STYLE AUTHORIZATION (§3, §12)
      Hidden navigation is not security: every sensitive action goes
      through API(), which checks actor + tenant + capability +
      assignment + agent state before anything happens, and records
      denials.
   ============================================================ */
const API_RULES={
 'agent.build.open':{cap:'agent.build'},
 'agent.build.create-for':{cap:'agent.build'},
 'jobmethod.download':{cap:'agent.build'},
 'jobmethod.upload':{cap:'agent.build'},
 'agent.activate':{cap:'agent.build'},
 'agent.run':{cap:'agent.run'},
 'access.update':{cap:'users.manage'},
 'user.invite':{cap:'users.manage'},
 'audit.view':{cap:'admin.modules'},
 'chat.post':{cap:'chat.use'},
};
function API(action,args){
 args=args||{};
 const rule=API_RULES[action];
 const r=role();
 if(!rule)return {ok:true};
 if(r.kind!=='company')return {ok:false,code:'TENANT_MISMATCH',msg:'Platform identities cannot act inside a company workspace.'};
 if(args.tenant&&args.tenant!==(r.tenant||TENANT))return {ok:false,code:'TENANT_ISOLATION',msg:'Cross-tenant request rejected.'};
 if(!hasCap(rule.cap))return {ok:false,code:'PERMISSION_DENIED',msg:'Your access does not include “'+CAP_BY_KEY[rule.cap].label+'”.'};
 if(action==='agent.run'){
  const chk=canRunAgent(args.agentId);
  if(!chk.ok)return chk;
 }
 if(action==='agent.activate'&&!AGENT_STATE.tested)
  return {ok:false,code:'TEST_REQUIRED',msg:'Test Agent must pass before activation.'};
 return {ok:true};
}
function apiDeny(res){
 audit('Authorization denied',res.code+' — '+res.msg);
 toast(res.msg);
 return false;
}

/* ---------- CSV parsing + mapping ---------- */
function parseCsv(text){
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
  else if(ch==='"')q=true;
  else if(ch===','){row.push(cell);cell='';}
  else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
  else if(ch!=='\r')cell+=ch;
 }
 if(cell.length||row.length){row.push(cell);rows.push(row);}
 return rows;
}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'');}
function mapJobMethod(text,fileName){
 const out={file:fileName,rows:[],issues:[],meta:{},unmapped:[],status:'Invalid / Unsupported File'};
 if(!/\.(csv|xlsx|xls)$/i.test(fileName)){out.issues.push({sev:'error',msg:'Unsupported file type — use the downloaded Job Method form (.csv or .xlsx).'});return out;}
 if(/\.(xlsx|xls)$/i.test(fileName)&&!/,/.test(text.slice(0,400))){
  out.issues.push({sev:'error',msg:'This prototype reads the CSV version of the form. Re-save the completed workbook as CSV and upload it again.'});return out;}
 const grid=parseCsv(text);
 if(!grid.length){out.issues.push({sev:'error',msg:'The file is empty.'});return out;}
 /* metadata block */
 grid.forEach(r=>{const k=norm(r[0]);
  if(k==='objectiveidversion')out.meta.obj=r[1];
  if(k==='aiworkassignmentid')out.meta.assign=r[1];
  if(k==='assignedemployee')out.meta.emp=r[1];
  if(k==='formversion')out.meta.formVer=r[1];
  if(k==='objective')out.meta.objName=r[1];
 });
 /* header row = the one containing a WHAT column */
 let hi=-1;
 for(let i=0;i<grid.length;i++){if(grid[i].some(c=>norm(c).indexOf('whatexactwork')>-1||norm(c)==='what')){hi=i;break;}}
 if(hi<0){out.issues.push({sev:'error',msg:'No Job Method table found — the WHAT / INPUT / HOW header row is missing.'});return out;}
 const head=grid[hi].map(norm);
 const colOf={};
 JM_FIELDS.forEach(f=>{
  const want=norm(f[1]);
  let idx=head.findIndex(h=>h===want);
  if(idx<0)idx=head.findIndex(h=>h&&(h.indexOf(norm(f[0]))===0||want.indexOf(h)===0&&h.length>3));
  if(idx>=0)colOf[f[0]]=idx;
 });
 const missingCols=JM_FIELDS.filter(f=>colOf[f[0]]===undefined);
 missingCols.forEach(f=>out.issues.push({sev:'warn',msg:'Column not found in file: '+f[1]+' — left blank for review.'}));
 head.forEach((h,i)=>{if(!h)return;if(norm('Step')===h)return;
  const used=Object.keys(colOf).some(k=>colOf[k]===i);
  if(!used)out.unmapped.push(grid[hi][i]);});
 out.unmapped.forEach(u=>out.issues.push({sev:'warn',msg:'Unrecognised column ignored: “'+u+'”.'}));
 /* data rows */
 for(let i=hi+1;i<grid.length;i++){
  const r=grid[i];
  if(!r.some(c=>String(c).trim()))continue;
  const row=Object.assign({},AB2_BLANK);let filled=0;const rowIssues=[];
  JM_FIELDS.forEach(f=>{const idx=colOf[f[0]];if(idx===undefined)return;
   const v=String(r[idx]==null?'':r[idx]).trim();if(v){row[f[0]]=v;filled++;}});
  if(!filled)continue;
  if(row.approval&&['Not required','Manager','Head','Four-eyes'].indexOf(row.approval)<0){
   rowIssues.push('Approval value “'+row.approval+'” is not a known option — set to “Not required” for review.');row.approval='Not required';}
  JM_REQUIRED.forEach(f=>{if(!row[f])rowIssues.push('Missing required field: '+JM_FIELDS.find(x=>x[0]===f)[1]+'.');});
  if(/(password|api[ _-]?key|secret|token|credential)/i.test(JSON.stringify(row)))
   rowIssues.push('Possible credential text detected — removed. Secrets never belong in a Job Method form.');
  row.__imported=true;row.__issues=rowIssues;
  out.rows.push(row);
  rowIssues.forEach(m=>out.issues.push({sev:'warn',msg:'Step '+out.rows.length+': '+m,row:out.rows.length}));
 }
 if(!out.rows.length){out.issues.push({sev:'error',msg:'No usable Job Method steps were found in the file.'});out.status='Invalid / Unsupported File';return out;}
 const needsInfo=out.rows.some(r=>JM_REQUIRED.some(f=>!r[f]));
 const warned=out.issues.some(i=>i.sev==='warn');
 out.status=needsInfo?'Missing Information':(warned?'Imported with Warnings':'Imported Successfully');
 return out;
}

function canRunAgent(agentId){
 const r=role(),me=meEmp();
 const a=AGENTS.find(x=>x.id===agentId);
 if(r.kind!=='company')return {ok:false,code:'TENANT_MISMATCH',msg:'This identity cannot operate company agents.'};
 if(!a)return {ok:false,code:'NOT_FOUND',msg:'Agent not found in this tenant.'};
 if(!hasCap('agent.run'))return {ok:false,code:'PERMISSION_DENIED',msg:'You do not have Run permission.'};
 const asn=assignmentForAgent(a.id);
 const assigned=asn?(asn.assignedEmp===me.id||asn.owner===me.id):(a.owner===me.name);
 const broad=hasCap('agent.build')||role().label==='Company Admin';
 if(!assigned&&!broad)return {ok:false,code:'NOT_ASSIGNED',msg:'“'+a.name+'” is not assigned or shared with you.'};
 if(a.status!=='Active')return {ok:false,code:'AGENT_NOT_LIVE',msg:'“'+a.name+'” is '+a.status.toLowerCase()+' — only live agents can be run.'};
 if(asn&&asn.state!=='Active')return {ok:false,code:'NOT_ACTIVATED',msg:'This Agent has not been activated yet.'};
 if(a.health==='At risk'||a.health==='Needs input')
  return {ok:true,warn:'Connection or input needs attention — the Executor will raise an exception if it blocks.'};
 return {ok:true};
}

  withSession('platform.admin@uboss.demo',()=>{const r=API('chat.post');return {ok:!r.ok&&r.code==='TENANT_MISMATCH',note:r.code||''};}));
 add('Normal chat messages are not written to the audit log',()=>
  ({ok:!AUDIT.some(a=>a.event==='Chat message'),note:'only sensitive chat actions are audited'}));
 return T;
}
SCR['qa-tests']=function(){
 const T=QA_CASES();
 const pass=T.filter(t=>t.ok).length;
 const rows=T.map(t=>'<tr><td>'+t.name+'</td><td class="muted">'+(t.note||'')+'</td><td class="'+(t.ok?'qa-pass':'qa-fail')+'">'+(t.ok?'PASS':'FAIL')+'</td></tr>').join('');
 const body='<div class="banner '+(pass===T.length?'ok':'warn')+'" style="margin-bottom:14px">'+ic(pass===T.length?'check2':'alert',18)+
  '<b>'+pass+' / '+T.length+' checks passing</b> — executed live against the access, import, run and chat logic in this build.</div>'+
  '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Check</th><th>Observed</th><th>Result</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 return {title:'Amendment QA checks',desc:'The test list from the change request, run in the browser.',crumb:'QA',body:body,
  actions:['<button class="btn btn-sm" data-nav="app/qa-tests">Re-run</button>','<button class="btn btn-sm" data-nav="app/audit">Audit trail</button>']};
};

/* login quick-fill gains the Power Employee identity */
(function addPowerLogin(){
 const prev=SCR.login;
 SCR.login=function(){
  let html=prev();
  const btn='<button data-action="as-power@spm.demo">'+av('Power Employee')+'<span>Power Employee</span><small>power@spm.demo</small></button>';
  html=html.replace('<button data-action="as-hr@spm.demo">',btn+'<button data-action="as-hr@spm.demo">');
  return html;
 };
 EXTRA_ACTIONS['as-power@spm.demo']=()=>loginAs('power@spm.demo');
})();

/* sidebar counters follow the amended access model (operators see
   their own assigned counts, not company-wide totals) */
function navCount(key){
 const r=role(),L=r.label;
 if(key==='chat')return hasCap('chat.use')?(CHAT.reduce((n,c)=>n+(c.unread||0),0)||null):null;
 if(key==='users'||key==='roles')return null;
 if(key==='agents'){
  if(!hasCap('agent.run'))return null;
  return hasCap('agent.build')?AGENTS.length:myAgents().length;
 }
 const P=(typeof PENDING!=='undefined')?PENDING.length:12,E=(typeof EXCEPTIONS!=='undefined')?EXCEPTIONS.length:5;
 const todo={Employee:4,'Power Employee':4,Manager:9,'Head — Regulatory':9,'Company Admin':P,Approver:0,Guest:1};
 const appr={Employee:1,'Power Employee':1,Manager:3,'Head — Regulatory':4,'Company Admin':5,Approver:5};
 const exec={Manager:E,'Head — Regulatory':E,'Company Admin':E};
 if(key==='todo')return todo[L]!=null?todo[L]:P;
 if(key==='approvals')return hasCap('approvals.act')?(appr[L]!=null?appr[L]:null):null;
 if(key==='executor')return hasCap('executor.use')?(exec[L]!=null?exec[L]:null):null;
 return null;
}

   INIT
   ============================================================ */
if(!location.hash)location.hash='#/login';
render();
