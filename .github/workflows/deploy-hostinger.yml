name: Deploy Chief Agent to Hostinger VPS

on:
  # Deliberately not `push`.
  #
  # It was, and that meant any commit to `main` touching `apps/**` went to the client's server
  # without anything having run first: CI started at the same moment as the deployment, not before
  # it, so a commit that broke the suite was released anyway and the first person to find out was
  # the client. `workflow_run` waits for CI to finish and the job below refuses to act unless it
  # finished green.
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ubossai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ubossai.com
    # Green CI, or nothing. `workflow_run` fires whatever CI concluded — including `failure` and
    # `cancelled` — so the conclusion has to be checked here or the gate is decorative. A manual
    # `workflow_dispatch` is still allowed, so a release can be forced when somebody means to.
    if: >-
      ${{ vars.HOSTINGER_VM_ID != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The commit CI actually tested, not whatever `main` points at by the time this runs.
          # Without this a second push during a deployment would release untested code under the
          # authority of the first push's green run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate integration secrets
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.UBOSS_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.UBOSS_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.UBOSS_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SMTP_HOST" || -n "$SMTP_USERNAME" || -n "$SMTP_PASSWORD" ]]; then
            if [[ -z "$SMTP_HOST" || -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" ]]; then
              echo 'SMTP secrets are incomplete; leaving the live VPS unchanged.' >&2
              exit 1
            fi
          fi

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: ubossai
          docker-compose-path: deploy/docker-compose.yaml
          environment-variables: |
            POSTGRES_PASSWORD=${{ secrets.UBOSS_POSTGRES_PASSWORD }}
            APP_DB_PASSWORD=${{ secrets.UBOSS_APP_DB_PASSWORD }}
            AUTH_ENCRYPTION_KEYS=${{ secrets.UBOSS_AUTH_ENCRYPTION_KEYS }}
            # The UBoss console owner — our own Platform Owner, not a customer. It was
            # `dev@uboss.com`, a domain this company does not own, so the one account the
            # deployment creates would have been unreachable by mail: no password reset, no
            # security alert, nothing. A company admin is a different person entirely and is
            # created from the console, never here.
            UBOSS_INITIAL_ADMIN_EMAIL=dev@ubossai.com
            UBOSS_INITIAL_ADMIN_NAME=Chief Agent Admin
            UBOSS_INITIAL_ADMIN_PASSWORD=${{ secrets.UBOSS_INITIAL_ADMIN_PASSWORD }}
            # A repository *variable*, not a secret — its value is the word `true` and nothing
            # worth hiding. Set it when the owner password has to be changed and the owner already
            # exists, which is the case a changed secret alone cannot reach: the bootstrap creates
            # an account and never edits one. Remove it after the deployment that uses it.
            UBOSS_INITIAL_ADMIN_PASSWORD_RESET=${{ vars.UBOSS_INITIAL_ADMIN_PASSWORD_RESET }}
            UBOSS_SMTP_HOST=${{ secrets.UBOSS_SMTP_HOST }}
            UBOSS_SMTP_PORT=${{ vars.UBOSS_SMTP_PORT || '587' }}
            UBOSS_SMTP_USERNAME=${{ secrets.UBOSS_SMTP_USERNAME }}
            UBOSS_SMTP_PASSWORD=${{ secrets.UBOSS_SMTP_PASSWORD }}
            UBOSS_SMTP_FROM_EMAIL=${{ secrets.UBOSS_SMTP_USERNAME }}
            UBOSS_SMTP_FROM_NAME=UBoss AI
            # Pilot mail only: keep old local fixture addresses and other tenants out of the live outbox.
            UBOSS_SMTP_ALLOWED_RECIPIENT_DOMAINS=ubossai.com,spmmedicare.com
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
            MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            MICROSOFT_TENANT_ID=${{ vars.MICROSOFT_TENANT_ID || 'common' }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_CLIENT_SECRET=${{ secrets.APPLE_CLIENT_SECRET }}

      # Hostinger acknowledges the deploy request before Docker has finished starting. Check the
      # public services so a broken container or failed TLS setup makes this workflow red.
      #
      # ## Why the window is three quarters of an hour
      #
      # It used to be twenty minutes, and it failed a deploy that had worked. The VPS builds all
      # four images from source — npm ci, tsc, next build, twice over — and on run #32 the API
      # answered for the first time **one minute after** this step gave up. The site had been
      # healthy for fifteen hours by the time anybody looked.
      #
      # That is the worst way for a check to be wrong. A deploy that is red when it succeeded
      # teaches everybody to ignore the red, and the next one that is red for a real reason is
      # ignored with it. So the window is now matched to how long a cold rebuild actually takes,
      # with room on top, rather than to how long somebody once guessed it would.
      #
      # One deadline for all four rather than forty-five minutes each: the API is what takes the
      # time, and once it answers the rest are seconds behind. That keeps the whole step bounded
      # at forty-five minutes however many URLs are listed.
      - name: Verify live services
        shell: bash
        run: |
          set -euo pipefail

          window_minutes=45
          deadline=$(( SECONDS + window_minutes * 60 ))

          # Says what it is waiting for, and says it once per change of state. Sixty identical
          # "Connection timed out" lines told nobody whether the box was building, broken or gone.
          wait_for() {
            local url="$1" last='' code started=$SECONDS
            while (( SECONDS < deadline )); do
              # curl writes `000` itself when it never got an answer, so the `|| true` is only
              # there to keep `set -e` from ending the job on a connection that was always going
              # to fail for the first few minutes. Adding an `echo` here as well printed `000000`.
              code=$(curl --location --silent --output /dev/null --write-out '%{http_code}' \
                          --max-time 10 "$url" || true)
              code=${code:-000}
              case "$code" in
                2??|3??)
                  echo "ready after $(( SECONDS - started ))s: $url ($code)"
                  return 0
                  ;;
              esac
              if [[ "$code" != "$last" ]]; then
                if [[ "$code" == 000 ]]; then
                  echo "waiting: $url is not answering yet — the VPS is still building images"
                else
                  echo "waiting: $url answered $code"
                fi
                last="$code"
              fi
              sleep 10
            done
            # The last thing it answered is the useful part: nothing at all means the stack is not
            # up yet, and an HTTP code means it is up and refusing, which are different problems.
            echo "Service did not become healthy within ${window_minutes} minutes: $url (last answer: ${last:-none})" >&2
            return 1
          }

          for url in \
            https://api.ubossai.com/health \
            https://app.ubossai.com/login \
            https://app.ubossai.com/api/auth/social-providers \
            https://chiefagent.ubossai.com/; do
            wait_for "$url"
          done
